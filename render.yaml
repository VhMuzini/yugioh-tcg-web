services:
  - type: web
    name: yugioh-tcg-web
    runtime: static
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/yugioh-tcg-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
